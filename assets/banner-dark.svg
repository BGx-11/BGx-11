<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 200" width="100%" height="100%">
  <defs>
    <!-- Deep Neutral Grayscale Background (Matches Portfolio) -->
    <linearGradient id="dark-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0e0e" />
      <stop offset="50%" stop-color="#080808" />
      <stop offset="100%" stop-color="#040404" />
    </linearGradient>

    <!-- Subtle Monochrome Ambient Aura -->
    <radialGradient id="ambient-spot" cx="20%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Hairline Specular Highlight (Pure Monochrome) -->
    <linearGradient id="top-edge-highlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Neutral Faint Dot Grid -->
    <pattern id="dark-dot-grid-pro" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(255, 255, 255, 0.09)" />
    </pattern>

    <!-- Radial Mask to softly dissolve grid at edges -->
    <radialGradient id="radial-mask-dark" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <mask id="grid-mask-d-pro">
      <rect width="100%" height="100%" fill="url(#radial-mask-dark)" />
    </mask>

    <style>
      .mono {
        font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace;
      }
      .sans {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif;
      }
      
      @keyframes pulse-dot-pro {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(0.85); }
      }
      .dot-glow {
        animation: pulse-dot-pro 2.4s ease-in-out infinite;
        transform-origin: 36px 34px;
      }

      /* Responsive rules for mobile screens */
      @media (max-width: 640px) {
        .hide-mobile { display: none; }
        .mobile-expand { font-size: 38px; }
        .mobile-desc { font-size: 16px; }
      }
    </style>
  </defs>

  <!-- Base Plate (Deep Neutral Charcoal/Black) -->
  <rect width="960" height="200" rx="10" fill="url(#dark-bg-grad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
  
  <!-- Monochrome Ambient Aura -->
  <rect width="960" height="200" rx="10" fill="url(#ambient-spot)" />

  <!-- Dissolving Neutral Dot Matrix -->
  <rect width="960" height="200" rx="10" fill="url(#dark-dot-grid-pro)" mask="url(#grid-mask-d-pro)" />

  <!-- Top Hairline Edge Highlight -->
  <line x1="20" y1="1" x2="940" y2="1" stroke="url(#top-edge-highlight)" stroke-width="1.2" />

  <!-- Top Telemetry Header -->
  <g class="mono" font-size="11" fill="#888888">
    <circle cx="36" cy="34" r="3.5" fill="#10b981" class="dot-glow" />
    <text x="48" y="38" font-weight="600" fill="#f4f4f5">BGx</text>
    <text x="80" y="38" fill="#52525b">/</text>
    <text x="94" y="38" fill="#d4d4d8">Devansh Agarwal</text>
    <text x="236" y="38" fill="#52525b">|</text>
    <text x="250" y="38" fill="#a1a1aa">Systems Architecture &amp; Security Research</text>

    <!-- Geographic Coordinates -->
    <text x="924" y="38" text-anchor="end" fill="#71717a" class="hide-mobile">26.20&#176; N, 92.93&#176; E [UTC+5:30]</text>
  </g>

  <!-- Subtle Horizontal Divider -->
  <line x1="36" y1="52" x2="924" y2="52" stroke="rgba(255, 255, 255, 0.07)" stroke-width="1" />

  <!-- Main Hero Content -->
  <g transform="translate(36, 110)">
    <text x="0" y="0" class="sans mobile-expand" font-size="34" font-weight="700" fill="#ffffff" letter-spacing="-0.8">
      Devansh Agarwal
    </text>
    <text x="320" y="-3" class="mono" font-size="12" font-weight="600" fill="#a1a1aa" letter-spacing="1">
      // BGx
    </text>
    <text x="0" y="30" class="sans mobile-desc" font-size="14" fill="#a1a1aa" font-weight="400">
      Building privacy-preserving software, zero-knowledge protocols, and native systems.
    </text>
  </g>

  <!-- Bottom Spec Chips -->
  <g transform="translate(36, 172)" class="mono" font-size="10.5">
    <!-- Chip 1: Rust -->
    <rect x="0" y="-14" width="62" height="20" rx="4" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.08)" />
    <text x="31" y="0" fill="#e4e4e7" text-anchor="middle" font-weight="500">RUST</text>

    <!-- Chip 2: Go -->
    <rect x="68" y="-14" width="46" height="20" rx="4" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.08)" />
    <text x="91" y="0" fill="#e4e4e7" text-anchor="middle" font-weight="500">GO</text>

    <!-- Chip 3: Win32 -->
    <rect x="120" y="-14" width="66" height="20" rx="4" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.08)" />
    <text x="153" y="0" fill="#e4e4e7" text-anchor="middle" font-weight="500">WIN32</text>

    <!-- Chip 4: AES-256-GCM -->
    <rect x="192" y="-14" width="94" height="20" rx="4" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.08)" />
    <text x="239" y="0" fill="#e4e4e7" text-anchor="middle" font-weight="500">AES-256-GCM</text>

    <!-- Chip 5: Tor SOCKS5 -->
    <rect x="292" y="-14" width="82" height="20" rx="4" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.08)" class="hide-mobile" />
    <text x="333" y="0" fill="#e4e4e7" text-anchor="middle" font-weight="500" class="hide-mobile">TOR SOCKS5</text>

    <!-- Chip 6: WASM DSP -->
    <rect x="380" y="-14" width="84" height="20" rx="4" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.08)" class="hide-mobile" />
    <text x="422" y="0" fill="#e4e4e7" text-anchor="middle" font-weight="500" class="hide-mobile">WASM DSP</text>

    <!-- Right link -->
    <text x="888" y="0" text-anchor="end" font-weight="600" fill="#f4f4f5">iambgx.in &#8599;</text>
  </g>
</svg>
