<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="100%" height="100%">
    <defs>
        <!-- Gradients -->
        <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.04" />
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0.00" />
        </linearGradient>
        <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="100%" stop-color="#888888" />
        </linearGradient>
        
        <style>
            .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 48px; fill: url(#text-grad); letter-spacing: 6px; }
            .subtitle { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 14px; fill: #666; letter-spacing: 8px; }
            
            .box-title { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 14px; fill: #555; letter-spacing: 2px; }
            .quote { font-family: system-ui, -apple-system, sans-serif; font-weight: 300; font-size: 22px; fill: #ccc; line-height: 1.6; }
            .highlight { font-weight: 600; fill: #fff; }
            
            .card-title { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 22px; fill: #fff; letter-spacing: 1px; }
            .card-desc { font-family: system-ui, -apple-system, sans-serif; font-weight: 400; font-size: 15px; fill: #888; }
            
            .pill { fill: rgba(255,255,255,0.03); stroke: rgba(255,255,255,0.1); stroke-width: 1; rx: 6; }
            .pill-text { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 12px; fill: #aaa; font-weight: 500;}
            
            .fade-in { animation: fadeIn 1.5s ease-out forwards; opacity: 0; }
            @keyframes fadeIn { to { opacity: 1; } }
        </style>
    </defs>
    
    <!-- Overall BG (Transparent) -->
    <rect width="100%" height="100%" fill="transparent" />

    <!-- Premium Abstract Background Rings -->
    <g opacity="0.15">
        <circle cx="150" cy="50" r="200" fill="none" stroke="#fff" stroke-width="1" stroke-dasharray="4 8" />
        <circle cx="850" cy="0" r="300" fill="none" stroke="#fff" stroke-width="0.5" />
    </g>

    <!-- HEADER (0 to 200) -->
    <g class="fade-in" transform="translate(500, 100)" text-anchor="middle">
        <text y="0" class="title">DEVANSH AGARWAL</text>
        <text y="45" class="subtitle">CREATIVE DEVELOPER AND STUDENT</text>
    </g>

    <!-- WHOAMI (220 to 400) -->
    <g class="fade-in" transform="translate(50, 200)" style="animation-delay: 0.2s">
        <!-- Glassmorphism Card -->
        <rect width="900" height="180" rx="16" fill="url(#card-grad)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
        
        <g transform="translate(40, 45)">
            <text class="box-title">/ WHOAMI</text>
            <g transform="translate(0, 45)" class="quote">
                <text y="0">"A <tspan class="highlight">10th grader</tspan> who builds full-stack apps with security baked in,</text>
                <text y="35">and free alternatives to tools that shouldn't cost money."</text>
            </g>
            <text x="820" y="105" text-anchor="end" font-family="ui-monospace, SFMono-Regular, monospace" font-size="16" fill="#fff" font-weight="bold">— I go by BGx.</text>
        </g>
    </g>

    <!-- PROJECTS (420 to 750) -->
    <g class="fade-in" transform="translate(50, 430)" style="animation-delay: 0.4s">
        <text x="10" y="0" class="box-title">/ FEATURED_WORK</text>
        
        <!-- Grid: 3 columns x 280px width, 30px gap = 900px -->
        
        <!-- Card 1: Veil -->
        <g transform="translate(0, 30)">
            <rect width="280" height="240" rx="16" fill="url(#card-grad)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
            <path d="M 30 40 L 50 60 M 50 40 L 30 60" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.3" />
            
            <text x="30" y="110" class="card-title">Veil Browser</text>
            <text x="30" y="145" class="card-desc">Secure, high-performance</text>
            <text x="30" y="170" class="card-desc">browser built for privacy.</text>
            
            <rect x="30" y="195" width="55" height="24" class="pill" />
            <text x="38" y="211" class="pill-text">Rust</text>
            <rect x="95" y="195" width="65" height="24" class="pill" />
            <text x="103" y="211" class="pill-text">Tauri</text>
        </g>

        <!-- Card 2: AetherDrop -->
        <g transform="translate(310, 30)">
            <rect width="280" height="240" rx="16" fill="url(#card-grad)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
            <circle cx="40" cy="50" r="12" stroke="#fff" stroke-width="3" fill="none" opacity="0.3" />
            
            <text x="30" y="110" class="card-title">AetherDrop</text>
            <text x="30" y="145" class="card-desc">Zero-knowledge P2P</text>
            <text x="30" y="170" class="card-desc">encrypted file sharing.</text>
            
            <rect x="30" y="195" width="85" height="24" class="pill" />
            <text x="38" y="211" class="pill-text">WebCrypto</text>
            <rect x="125" y="195" width="80" height="24" class="pill" />
            <text x="133" y="211" class="pill-text">Firebase</text>
        </g>

        <!-- Card 3: ShadowLog -->
        <g transform="translate(620, 30)">
            <rect width="280" height="240" rx="16" fill="url(#card-grad)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
            <rect x="28" y="38" width="24" height="24" stroke="#fff" stroke-width="3" fill="none" rx="4" opacity="0.3" />
            
            <text x="30" y="110" class="card-title">ShadowLog</text>
            <text x="30" y="145" class="card-desc">Stealth security research</text>
            <text x="30" y="170" class="card-desc">and logging utility.</text>
            
            <rect x="30" y="195" width="40" height="24" class="pill" />
            <text x="38" y="211" class="pill-text">Go</text>
            <rect x="80" y="195" width="65" height="24" class="pill" />
            <text x="88" y="211" class="pill-text">Kotlin</text>
        </g>
    </g>
</svg>
