    </style>
  </defs>
  <rect width="460" height="120" rx="8" fill="#0d0d0d" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
  
  <!-- Category & Arrow -->
  <g class="mono" font-size="10" fill="#71717a">
