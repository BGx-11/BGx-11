<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="800" height="220">
    <defs>
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0a0a0c" />
            <stop offset="100%" stop-color="#12131a" />
        </linearGradient>
        
        <!-- Subtle grid pattern -->
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.05" />
        </pattern>
        
        <!-- Delicate glowing line gradient -->
        <linearGradient id="lineGlow" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#4a4a5a" stop-opacity="0" />
            <stop offset="50%" stop-color="#a0a5b5" stop-opacity="0.8" />
            <stop offset="100%" stop-color="#4a4a5a" stop-opacity="0" />
        </linearGradient>

        <style>
            @import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;400;600&amp;family=JetBrains+Mono:wght@100;300&amp;display=swap');
            
            .name {
                font-family: 'Inter', sans-serif;
                font-weight: 600;
                font-size: 48px;
                fill: #ffffff;
                letter-spacing: -1px;
            }
            .role {
                font-family: 'JetBrains Mono', monospace;
                font-weight: 300;
                font-size: 16px;
                fill: #8a8d98;
                letter-spacing: 3px;
                text-transform: uppercase;
            }
            .tag {
                font-family: 'Inter', sans-serif;
                font-weight: 400;
                font-size: 14px;
                fill: #6e717d;
            }
            .fade-in {
                animation: fadeIn 2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
                opacity: 0;
            }
            @keyframes fadeIn {
                to { opacity: 1; }
            }
            
            .pan-bg {
                animation: panGrid 20s linear infinite;
            }
            @keyframes panGrid {
                from { transform: translateX(0) translateY(0); }
                to { transform: translateX(-40px) translateY(-40px); }
            }
        </style>
    </defs>

    <!-- Background -->
    <rect width="100%" height="100%" fill="url(#bg)" rx="10" ry="10"/>
    
    <!-- Animated Grid -->
    <g class="pan-bg">
        <rect width="110%" height="110%" fill="url(#grid)" x="-20" y="-20" />
    </g>

    <!-- Overlay gradient to fade out edges -->
    <rect width="100%" height="100%" fill="url(#bg)" opacity="0.6" rx="10" ry="10"/>

    <!-- Content -->
    <g class="fade-in" text-anchor="middle" transform="translate(400, 100)">
        <text y="-25" class="tag">DEV_ID: BGx</text>
        <text y="25" class="name">Devansh Agarwal</text>
        
        <!-- Elegant separator -->
        <rect x="-150" y="45" width="300" height="1" fill="url(#lineGlow)" />
        
        <text y="75" class="role">Creative Developer &amp; Student</text>
    </g>

    <!-- Minimal aesthetic dots -->
    <g transform="translate(30, 30)" opacity="0.3">
        <circle cx="0" cy="0" r="3" fill="#ffffff" />
        <circle cx="15" cy="0" r="3" fill="#ffffff" />
        <circle cx="30" cy="0" r="3" fill="#ffffff" />
    </g>
</svg>
