<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 140" width="800" height="140">
    <defs>
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0c0d12" />
            <stop offset="100%" stop-color="#14151c" />
        </linearGradient>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&amp;display=swap');
            .title { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 22px; fill: #ffffff; }
            .desc { font-family: 'Inter', sans-serif; font-weight: 300; font-size: 14px; fill: #a0a5b5; }
            .tech-pill { fill: rgba(255, 255, 255, 0.05); stroke: rgba(255, 255, 255, 0.1); stroke-width: 1; rx: 10; }
            .tech-text { font-family: 'Inter', sans-serif; font-weight: 400; font-size: 11px; fill: #d4d4d4; text-anchor: middle; }
            .card { animation: fadeIn 1s ease-out forwards; opacity: 0; animation-delay: 0.2s; }
            @keyframes fadeIn { to { opacity: 1; } }
            .hover-box:hover .border { stroke: #9cdcfe; }
        </style>
    </defs>

    <g class="card hover-box">
        <rect width="800" height="140" fill="transparent" />
        
        <rect x="50" y="10" width="700" height="120" rx="8" fill="url(#bg)" stroke="#1f2029" stroke-width="1" class="border" style="transition: stroke 0.3s ease;" />
        
        <!-- Subtle accent line -->
        <rect x="50" y="10" width="4" height="120" fill="#9cdcfe" rx="2" />

        <g transform="translate(80, 40)">
            <text y="0" class="title">AetherDrop</text>
            <text y="25" class="desc">Zero-knowledge peer-to-peer encrypted file sharing</text>
            <text y="45" class="desc">military-grade AES-256-GCM Web Crypto API.</text>
            
            <g transform="translate(0, 65)">
                <rect x="0" y="0" width="70" height="20" class="tech-pill" />
                <text x="35" y="14" class="tech-text">Next.js</text>
                
                <rect x="80" y="0" width="90" height="20" class="tech-pill" />
                <text x="125" y="14" class="tech-text">Web Crypto</text>
                
                <rect x="180" y="0" width="75" height="20" class="tech-pill" />
                <text x="217" y="14" class="tech-text">Firebase</text>
            </g>
        </g>
        
        <!-- Lock Graphic -->
        <g transform="translate(660, 45)" fill="none" stroke="#2d2e36" stroke-width="2">
            <rect x="0" y="15" width="30" height="25" rx="3" />
            <path d="M 5 15 L 5 10 C 5 -5 25 -5 25 10 L 25 15" />
            <circle cx="15" cy="27" r="2" fill="#2d2e36" />
        </g>
    </g>
</svg>
