<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="100%" height="100%">
    <defs>
        <pattern id="bg-grid" class="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke-width="1" />
        </pattern>
        
        <mask id="grid-mask">
            <rect width="100%" height="100%" fill="url(#grid-mask-grad)" />
        </mask>

        <radialGradient id="grid-mask-grad" cx="50%" cy="50%" r="70%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
        </radialGradient>

        <filter id="light-shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.08" />
        </filter>

        <style>
            @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&amp;family=Inter:wght@300;400;500&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap');
            
            /* Typography */
            .title { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 64px; letter-spacing: -1px; }
            .subtitle { font-family: 'JetBrains Mono', monospace; font-size: 14px; letter-spacing: 4px; text-transform: uppercase; }
            .box-title { font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; }
            .quote { font-family: 'Inter', sans-serif; font-weight: 300; font-size: 22px; line-height: 1.6; }
            .highlight { font-weight: 500; }
            .card-category { font-family: 'JetBrains Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; }
            .card-title { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 30px; letter-spacing: -0.5px; }
            .card-desc { font-family: 'Inter', sans-serif; font-weight: 400; font-size: 15px; line-height: 1.6; }
            .pill-text { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 400;}

            /* Animations */
            .fade-in { animation: fadeIn 1.5s ease-out forwards; opacity: 0; }
            @keyframes fadeIn { to { opacity: 1; } }
            
            @keyframes pulseDot {
                0%, 100% { opacity: 1; transform: scale(1); }
                50% { opacity: 0.4; transform: scale(0.9); }
            }
            .pulse-dot { animation: pulseDot 2s ease-in-out infinite; transform-origin: center; }
            .pulse-glow { animation: pulseDot 2s ease-in-out infinite; transform-origin: center; }

            /* Smooth Overlapping Sine Waves */
            .wave { fill: #000000; }
            .w1 { opacity: 0.03; animation: drift 20s infinite linear; }
            .w2 { opacity: 0.05; animation: drift 25s infinite linear reverse; }
            .w3 { opacity: 0.02; animation: drift 30s infinite linear; }
            
            @keyframes drift {
                0% { transform: translateX(0); }
                100% { transform: translateX(-1000px); }
            }

            /* --- HARDCODED LIGHT MODE GRAYSCALE --- */
            .bg { fill: #f2f2f2; }
            .grid-pattern path { stroke: rgba(0,0,0,0.05); }
            .title, .card-title, .highlight { fill: #111111; }
            .subtitle, .quote, .box-title, .card-desc, .card-category { fill: rgba(0,0,0,0.5); }
            .pill { fill: rgba(0,0,0,0.05); stroke: rgba(0,0,0,0.1); stroke-width: 1; rx: 6; }
            .pill-text { fill: rgba(0,0,0,0.7); }
            .glass-rect { fill: rgba(255,255,255,0.8); stroke: rgba(0,0,0,0.05); filter: url(#light-shadow); }
            .pulse-dot { fill: #111111; }
            .pulse-glow { fill: rgba(0, 0, 0, 0.15); }
        </style>
    </defs>
    
    <!-- Background -->
    <rect width="100%" height="100%" class="bg" />
    <rect width="100%" height="100%" fill="url(#bg-grid)" mask="url(#grid-mask)" />

    <!-- Animated Smooth Waves -->
    <g pointer-events="none">
        <path class="wave w1" d="M0,650 C300,550 600,750 1000,650 C1400,550 1700,750 2000,650 L2000,750 L0,750 Z" />
        <path class="wave w2" d="M0,670 C400,770 700,570 1100,670 C1500,770 1800,570 2200,670 L2200,750 L0,750 Z" />
        <path class="wave w3" d="M0,630 C350,530 650,730 1050,630 C1450,530 1750,730 2150,630 L2150,750 L0,750 Z" />
    </g>

    <!-- HEADER -->
    <g class="fade-in" transform="translate(500, 100)" text-anchor="middle">
        <text y="0" class="title">DEVANSH AGARWAL</text>
        <text y="45" class="subtitle">Creative Developer and Student</text>
    </g>

    <!-- WHOAMI Glassmorphic Card -->
    <g class="fade-in" transform="translate(50, 200)" style="animation-delay: 0.2s">
        <rect width="900" height="180" rx="16" class="glass-rect" stroke-width="1.5" />
        
        <g transform="translate(45, 45)">
            <text class="box-title">/ WHOAMI</text>
            <g transform="translate(0, 45)" class="quote">
                <text y="0">"A <tspan class="highlight">student</tspan> who builds full-stack apps with security baked in,</text>
                <text y="35">and free alternatives to tools that shouldn't cost money."</text>
            </g>
            <text x="810" y="105" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold" class="highlight">— I go by BGx.</text>
        </g>
    </g>

    <!-- PROJECTS Grid -->
    <g class="fade-in" transform="translate(50, 430)" style="animation-delay: 0.4s">
        <!-- Live Dot -->
        <circle cx="10" cy="-4" r="8" class="pulse-glow" />
        <circle cx="10" cy="-4" r="4" class="pulse-dot" />
        <text x="30" y="0" class="box-title" fill="currentColor">SELECTED_WORKS</text>
        
        <!-- Card 1: Veil -->
        <g transform="translate(0, 30)">
            <rect width="280" height="250" rx="16" class="glass-rect" stroke-width="1.5" />
            
            <text x="24" y="34" class="card-category">TOOLS</text>
            
            <text x="24" y="85" class="card-title">Veil</text>
            <text x="24" y="120" class="card-desc">Privacy-hardened</text>
            <text x="24" y="145" class="card-desc">desktop browser built</text>
            <text x="24" y="170" class="card-desc">entirely with Rust.</text>
            
            <rect x="24" y="200" width="45" height="26" class="pill" />
            <text x="32" y="217" class="pill-text">Rust</text>
            <rect x="75" y="200" width="55" height="26" class="pill" />
            <text x="83" y="217" class="pill-text">Tauri</text>
        </g>

        <!-- Card 2: AetherDrop -->
        <g transform="translate(310, 30)">
            <rect width="280" height="250" rx="16" class="glass-rect" stroke-width="1.5" />
            
            <text x="24" y="34" class="card-category">TOOLS</text>
            
            <text x="24" y="85" class="card-title">Aether Drop</text>
            <text x="24" y="120" class="card-desc">Zero-knowledge encrypted</text>
            <text x="24" y="145" class="card-desc">peer-to-peer file</text>
            <text x="24" y="170" class="card-desc">sharing platform.</text>
            
            <rect x="24" y="200" width="80" height="26" class="pill" />
            <text x="32" y="217" class="pill-text">WebCrypto</text>
            <rect x="110" y="200" width="75" height="26" class="pill" />
            <text x="118" y="217" class="pill-text">Firebase</text>
        </g>

        <!-- Card 3: ShadowLog -->
        <g transform="translate(620, 30)">
            <rect width="280" height="250" rx="16" class="glass-rect" stroke-width="1.5" />
            
            <text x="24" y="34" class="card-category">OFFENSIVE</text>
            
            <text x="24" y="85" class="card-title">Shadow Log</text>
            <text x="24" y="120" class="card-desc">High-performance native</text>
            <text x="24" y="145" class="card-desc">systems monitoring</text>
            <text x="24" y="170" class="card-desc">and research framework.</text>
            
            <rect x="24" y="200" width="35" height="26" class="pill" />
            <text x="32" y="217" class="pill-text">Go</text>
            <rect x="65" y="200" width="60" height="26" class="pill" />
            <text x="73" y="217" class="pill-text">Kotlin</text>
        </g>
    </g>
</svg>
