<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240">
    <defs>
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0c0d12" />
            <stop offset="100%" stop-color="#14151c" />
        </linearGradient>
        
        <style>
            @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&amp;family=Inter:wght@300;400;600&amp;display=swap');
            
            .header {
                font-family: 'JetBrains Mono', monospace;
                font-size: 13px;
                fill: #6e717d;
                letter-spacing: 2px;
            }
            .text-body {
                font-family: 'Inter', sans-serif;
                font-weight: 300;
                font-size: 17px;
                fill: #d4d4d4;
                line-height: 1.8;
                font-style: italic;
            }
            .highlight {
                font-weight: 600;
                fill: #ffffff;
                font-style: normal;
            }
            .accent {
                font-family: 'JetBrains Mono', monospace;
                font-size: 15px;
                fill: #4a90e2;
            }
            
            .fade-in {
                animation: fadeIn 1s ease-out forwards;
                opacity: 0;
            }
            
            @keyframes fadeIn {
                to { opacity: 1; }
            }
        </style>
    </defs>

    <rect width="100%" height="100%" fill="transparent" />

    <g class="fade-in" style="animation-delay: 0.2s;">
        <!-- Card Body -->
        <rect x="50" y="20" width="700" height="200" rx="16" fill="url(#bg)" stroke="#1f2029" stroke-width="1" />
        
        <!-- Subtle accent line on the left -->
        <rect x="50" y="20" width="4" height="200" fill="#4a90e2" rx="2" />

        <!-- Abstract Quote Icon -->
        <text x="100" y="150" font-family="serif" font-size="160" font-weight="bold" fill="#ffffff" opacity="0.03">"</text>

        <g transform="translate(110, 60)">
            <text class="header">/ WHOAMI</text>
            
            <g transform="translate(0, 45)" class="text-body">
                <text y="0">"A <tspan class="highlight">10th grader</tspan> who builds full-stack apps</text>
                <text y="30">with security baked in, and free alternatives</text>
                <text y="60">to tools that shouldn't cost money."</text>
            </g>

            <g transform="translate(0, 140)">
                <text class="accent">— I go by <tspan class="highlight" font-size="16">BGx.</tspan></text>
            </g>
        </g>
    </g>
</svg>
