<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" width="800" height="160">
    <defs>
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0c0d12" />
            <stop offset="100%" stop-color="#14151c" />
        </linearGradient>
        
        <style>
            @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&amp;family=Inter:wght@300;400;500&amp;display=swap');
            
            .header {
                font-family: 'JetBrains Mono', monospace;
                font-size: 13px;
                fill: #6e717d;
                letter-spacing: 2px;
            }
            .text-body {
                font-family: 'Inter', sans-serif;
                font-weight: 300;
                font-size: 16px;
                fill: #d4d4d4;
                line-height: 1.8;
            }
            .highlight {
                font-family: 'Inter', sans-serif;
                font-weight: 500;
                fill: #ffffff;
            }
            .accent {
                font-family: 'JetBrains Mono', monospace;
                font-size: 16px;
                fill: #4a90e2;
            }
            
            .fade-in {
                animation: fadeIn 1s ease-out forwards;
                opacity: 0;
            }
            
            @keyframes fadeIn {
                to { opacity: 1; }
            }
        </style>
    </defs>

    <rect width="100%" height="100%" fill="transparent" />

    <g class="fade-in" style="animation-delay: 0.2s;">
        <!-- Card Body -->
        <rect x="50" y="20" width="700" height="140" rx="12" fill="url(#bg)" stroke="#1f2029" stroke-width="1" />
        
        <!-- Subtle accent line on the left -->
        <rect x="50" y="20" width="3" height="140" fill="#4a90e2" rx="1.5" />

        <g transform="translate(90, 60)">
            <text class="header">/ WHOAMI</text>
            
            <g transform="translate(0, 40)" class="text-body">
                <text y="0">A <tspan class="highlight">10th grader</tspan> who builds full-stack apps</text>
                <text y="25">with security baked in, and free alternatives</text>
                <text y="50">to tools that shouldn't cost money.</text>
                
                <text y="90">I go by <tspan class="accent">BGx.</tspan></text>
            </g>
        </g>
    </g>
</svg>
